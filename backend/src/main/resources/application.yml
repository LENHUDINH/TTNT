debug: false
logging:
  level:
    root: INFO
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: ${COOKIE_SECURE:false}
        same-site: lax
spring:
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_TLS:false}
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000
  datasource:
    url: ${DB_URL:jdbc:mariadb://127.0.0.1:3306/finsight}
    username: ${DB_USER:finsight_xampp}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Asia/Ho_Chi_Minh
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB
finsight:
  ai-url: ${AI_URL:http://127.0.0.1:8000}
  ai-key: ${AI_SERVICE_KEY:}
  frontend-origin: ${FRONTEND_ORIGIN:http://127.0.0.1:5173}
  demo-enabled: ${DEMO_ENABLED:false}
  reset-token-log: ${RESET_TOKEN_LOG:false}
